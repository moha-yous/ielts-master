<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Master Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --card: rgba(255, 255, 255, 0.06); --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        .container { max-width: 600px; margin: 20px auto; padding: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .btn { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .screen { display: none; } .active { display: block; }
        .test-item { background: #1e293b; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="home" class="screen active">
        <h1>IELTS Master Pro</h1>
        <p>Choose a practice test to start your journey.</p>
        <div id="testList"></div>
    </div>

    <div id="test-room" class="screen">
        <h2 id="test-title">Test Name</h2>
        <div id="questions"></div>
        <button class="btn" onclick="finishTest()">Submit Answers</button>
    </div>

    <div id="results" class="screen">
        <h2>Your Result</h2>
        <div style="font-size: 48px; color: #10b981;" id="final-band">0.0</div>
        <button class="btn" onclick="location.reload()">Back to Home</button>
    </div>
</div>

<script>
    const tests = [
        { id: 0, title: "Reading Practice Test 1", questions: 3 },
        { id: 1, title: "Reading Practice Test 2", questions: 3 },
        { id: 2, title: "Reading Practice Test 3", questions: 3 }
    ];

    function init() {
        const list = document.getElementById('testList');
        tests.forEach(t => {
            list.innerHTML += `<div class="test-item" onclick="startTest(${t.id})">${t.title}</div>`;
        });
    }

    function startTest(id) {
        document.getElementById('home').classList.remove('active');
        document.getElementById('test-room').classList.add('active');
        document.getElementById('test-title').innerText = tests[id].title;
    }

    function finishTest() {
        // Mock score calculation logic
        const band = (Math.random() * (9 - 5) + 5).toFixed(1);
        document.getElementById('test-room').classList.remove('active');
        document.getElementById('results').classList.add('active');
        document.getElementById('final-band').innerText = "Band " + band;
    }

    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA ready and registered!'))
                .catch(err => console.log('Service Worker registration failed:', err));
        });
    }

    init();
</script>
</body>
</html>
